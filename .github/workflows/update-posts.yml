# Checks the Kenmack Music Blog on Substack once a day and updates the
# blog cards on kenmackmusic.com when there is a new post.
# It can also be run by hand from the repository's Actions tab.
name: Update blog posts

on:
  schedule:
    - cron: "17 11 * * *"   # every day at 11:17 UTC (about 6 a.m. in Huntsville)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Read the Substack feed
        run: python scripts/update_posts.py
      - name: Save changes, if any
        run: |
          if git diff --quiet -- posts.json; then
            echo "Nothing to commit."
          else
            git config user.name "kenmackmusic-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add posts.json
            git commit -m "Update blog posts from Substack"
            git push
          fi
